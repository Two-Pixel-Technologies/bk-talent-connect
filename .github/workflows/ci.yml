name: CI

on:
  push:
    branches: [main]
  pull_request:

# The plan's central defence against hand-written-SQL drift is the
# schema-parity test. A pre-commit hook is bypassable with --no-verify and does
# not run on the deploy path, so the guard has to live here to mean anything.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # better-sqlite3 is a native addon; npm ci compiles or fetches the
      # prebuild for this exact Node version.
      - name: Install dependencies
        run: npm ci

      - name: Verify native bindings load
        run: node -e "require('better-sqlite3')"

      - name: Build shared package
        run: npm run build --workspace=@bktc/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catches a bare @bktc/shared import that Node cannot resolve from dist/ —
      # the classic monorepo failure that only appears in production.
      - name: Verify built API starts outside the workspace root
        run: |
          cd /tmp
          NODE_ENV=production \
          DATABASE_PATH=/tmp/ci-check.db \
          UPLOADS_DIR=/tmp/ci-uploads \
          TMP_DIR=/tmp/ci-tmp \
          APP_ORIGIN=http://localhost:5173 \
          timeout 10s node "$GITHUB_WORKSPACE/apps/api/dist/index.js" &
          sleep 4
          curl --fail --silent --show-error http://localhost:4000/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
