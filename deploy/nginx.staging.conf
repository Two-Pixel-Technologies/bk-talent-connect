# staging.bktalentconnect.com
#
# The same droplet, a second pm2 process on :4001, its own database restored
# nightly from production's backup. Marginal cost zero, and it is the only
# place a migration is rehearsed before it touches real data.
#
# Install:
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-staging bk
#   sudo cp deploy/nginx.staging.conf /etc/nginx/sites-available/bktc-staging
#   sudo ln -s /etc/nginx/sites-available/bktc-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d staging.bktalentconnect.com --deploy-hook "systemctl reload nginx"

server {
    listen 80;
    listen [::]:80;
    server_name staging.bktalentconnect.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.bktalentconnect.com;

    ssl_certificate     /etc/letsencrypt/live/staging.bktalentconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.bktalentconnect.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Basic auth over the whole site. Staging holds a copy of production data —
    # real candidates, real CVs — so it is exactly as sensitive as production
    # and must not be reachable, or indexable, by anyone else.
    auth_basic           "BK Talent Connect — staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # Belt and braces against a leaked URL ending up in a search index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    set $spa_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;

    root /var/www/bktc-staging/current/web;
    index index.html;
    client_max_body_size 8m;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy $spa_csp;
    }

    location /api/ {
        # The only line that differs from production: port 4001.
        proxy_pass         http://127.0.0.1:4001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    location / {
        add_header Content-Security-Policy $spa_csp;
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        deny all;
        return 404;
    }
}
