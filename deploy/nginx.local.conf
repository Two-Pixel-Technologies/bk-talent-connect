# Local nginx — the production topology, without TLS.
#
# nginx serves the built SPA from disk and proxies /api to the Node API, so the
# browser sees ONE origin. That is exactly the arrangement on the droplet, which
# means cookies, the CSRF Origin check, deep links and cache headers behave here
# the way they will there.
#
# Paths are rewritten by scripts/nginx-local.sh — do not run this file directly.
# Path placeholders are quoted: nginx splits directive arguments on whitespace,
# and a repo path containing a space would otherwise be read as two arguments.
#
# Differences from deploy/nginx.conf (production): no TLS, no HSTS, no
# upgrade-insecure-requests, and it listens on 8080 rather than 80/443.

worker_processes 1;
daemon off;
pid "__RUN_DIR__/nginx.pid";
error_log "__RUN_DIR__/error.log" warn;

events {
    worker_connections 256;
}

http {
    include       "__MIME_TYPES__";
    default_type  application/octet-stream;

    access_log "__RUN_DIR__/access.log";

    client_body_temp_path "__RUN_DIR__/client_body";
    proxy_temp_path       "__RUN_DIR__/proxy";
    fastcgi_temp_path     "__RUN_DIR__/fastcgi";
    uwsgi_temp_path       "__RUN_DIR__/uwsgi";
    scgi_temp_path        "__RUN_DIR__/scgi";

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml;

    server {
        listen      8080;
        server_name localhost;

        root  "__WEB_DIST__";
        index index.html;

        # Resumes are capped at 5MB by the API; nginx must not reject first.
        client_max_body_size 8m;

        # CSP for the SPA. nginx serves index.html directly, so this cannot be set
        # by the API — without it the app ships with no policy at all.
        # connect-src 'self' is required or the app cannot call its own API.
        # No upgrade-insecure-requests here: on a plain-http origin it rewrites
        # asset URLs to https, nothing is listening, and the page renders blank.
        set $spa_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # Fingerprinted by Vite — content behind a given URL never changes.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Never cache the entry point. A cached index.html points at a JS bundle
        # the next deploy deletes, and the user gets a white screen they cannot
        # fix without a hard refresh.
        location = /index.html {
            add_header Cache-Control "no-store";
            add_header Content-Security-Policy $spa_csp;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /api/ {
            proxy_pass         http://127.0.0.1:4000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # One hop. The API sets `trust proxy` to 1 to match — get this pair
            # wrong and either every client looks like 127.0.0.1 (so five failed
            # logins lock out everyone) or a client can forge its own IP.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout      120s;
            proxy_send_timeout      120s;
            proxy_request_buffering off;
        }

        # SPA history fallback: /candidate/profile is a client route, not a file.
        location / {
            add_header Content-Security-Policy $spa_csp;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri $uri/ /index.html;
        }

        # Uploads are served only through the authorised API route.
        location /uploads/ {
            deny all;
            return 404;
        }
    }
}
