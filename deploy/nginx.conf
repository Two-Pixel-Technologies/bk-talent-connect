# nginx site config for bktalentconnect.com
#
# Keep the cache policy here in step with apps/api/src/middleware/static-spa.ts,
# which reproduces it for `npm run start:prod` locally.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/bktalentconnect
#   sudo ln -s /etc/nginx/sites-available/bktalentconnect /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bktalentconnect.com -d www.bktalentconnect.com \
#        --deploy-hook "systemctl reload nginx"
#
# The deploy-hook matters: without it the certificate renews and nginx keeps
# serving the expired one for up to 60 days.

server {
    listen 80;
    listen [::]:80;
    server_name bktalentconnect.com www.bktalentconnect.com;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.bktalentconnect.com;

    ssl_certificate     /etc/letsencrypt/live/bktalentconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bktalentconnect.com/privkey.pem;

    # One canonical host, so cookies and the CSRF Origin check see one origin.
    return 301 https://bktalentconnect.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bktalentconnect.com;

    ssl_certificate     /etc/letsencrypt/live/bktalentconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bktalentconnect.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;

    # The atomic-deploy symlink. Flipping it back is the rollback.
    root /var/www/bktc/current/web;
    index index.html;

    # Resumes can be 5MB; the API caps them, this must not reject first.
    client_max_body_size 8m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # Fingerprinted by Vite — the content behind a given URL never changes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point. A cached index.html references a JS bundle
    # that is deleted by the second deploy, and the user gets a white screen
    # they cannot fix without a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Exactly one hop. The API sets `trust proxy` to 1 to match; getting
        # this pair wrong either makes every client look like 127.0.0.1 (so five
        # failed logins lock out the platform) or lets a client forge its own IP.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for a 5MB upload on a slow Indian mobile connection.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_request_buffering off;
    }

    # SPA history fallback: /candidate/profile is a client route, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploads are served only through the authorised API route, never directly.
    location /uploads/ {
        deny all;
        return 404;
    }
}
