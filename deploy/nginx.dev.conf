# Local nginx for development.
#
#   nginx :8080  ──┬── /      → Vite dev server :5173  (hot reload)
#                  └── /api   → Node API        :4000
#
# One origin, so cookies and the CSRF Origin check behave exactly as they do in
# production — but you still get hot reload while working.
#
# Paths are rewritten by scripts/nginx-dev.sh; placeholders are quoted because
# nginx splits directive arguments on whitespace and this repo lives under a
# path containing a space.

worker_processes 1;
daemon off;
pid "__RUN_DIR__/nginx.pid";
error_log "__RUN_DIR__/error.log" warn;

events {
    worker_connections 256;
}

http {
    include       "__MIME_TYPES__";
    default_type  application/octet-stream;
    access_log    "__RUN_DIR__/access.log";

    client_body_temp_path "__RUN_DIR__/client_body";
    proxy_temp_path       "__RUN_DIR__/proxy";
    fastcgi_temp_path     "__RUN_DIR__/fastcgi";
    uwsgi_temp_path       "__RUN_DIR__/uwsgi";
    scgi_temp_path        "__RUN_DIR__/scgi";

    sendfile on;

    server {
        listen      8080;
        server_name localhost;

        client_max_body_size 8m;

        location /api/ {
            proxy_pass         http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Everything else to Vite, including its websocket for hot reload.
        location / {
            proxy_pass         http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
